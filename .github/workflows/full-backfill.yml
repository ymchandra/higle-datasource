name: Full backfill

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: First month to process (1-12)
        required: false
        default: '1'
        type: string
      end_month:
        description: Last month to process (1-12)
        required: false
        default: '12'
        type: string
      force_overwrite:
        description: Re-fetch and overwrite days that already have data
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill calendar days (incl. 02-29) and update data/manifest.json
        env:
          START_MONTH: ${{ inputs.start_month }}
          END_MONTH: ${{ inputs.end_month }}
          FORCE: ${{ inputs.force_overwrite }}
        run: |
          args=(--mode full --start-month "$START_MONTH" --end-month "$END_MONTH")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/pipeline.py "${args[@]}"

      - name: Validate every generated file
        run: python scripts/validate_data.py

      - name: Commit and push in a single commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore(data): full backfill of history events [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No data changes."
          fi
