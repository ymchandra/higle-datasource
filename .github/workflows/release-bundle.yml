name: Release offline bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data before bundling
        run: python scripts/validate_data.py --require-all

      - name: Build higle-offline-bundle.zip
        run: python scripts/export_bundle.py

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" higle-offline-bundle.zip --generate-notes --title "$GITHUB_REF_NAME"
